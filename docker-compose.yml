services:
  postgres:
    image: postgres:16-alpine
    container_name: consultancy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: consultancy
      POSTGRES_PASSWORD: consultancy
      POSTGRES_DB: tbd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultancy -d tbd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
